name: changes

# Reusable change detector. A project passes named groups and the file
# patterns that belong to each group; the workflow reports which groups a
# pull request touches. The caller gates its expensive jobs on the JSON list
# in the `groups` output. Only `actions/checkout` and git are used.
on:
  workflow_call:
    inputs:
      groups:
        description: "Groups as lines of `name: pattern pattern...`."
        required: true
        type: string
      always:
        description: "Patterns that switch every group on (space separated)."
        required: false
        default: .github/* scripts/*
        type: string
    outputs:
      groups:
        description: "JSON array of the group names to build, in input order."
        value: ${{ jobs.changes.outputs.groups }}

permissions: {}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.detect.outputs.groups }}
    steps:
      # The checkout of a pull request is the merge commit, so its first
      # parent is the base branch. Two commits of history are enough to diff
      # that merge commit against the base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changed groups
        id: detect
        shell: bash
        env:
          GROUP_SPEC: ${{ inputs.groups }}
          ALWAYS: ${{ inputs.always }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Parse and validate the group specification first, so a typo fails
          # the run before any git command.
          names=()
          specs=()
          while IFS= read -r line; do
            if [[ -z "$line" ]]; then
              continue
            fi
            if [[ "$line" != *:* ]]; then
              echo "::error::groups line without ':': ${line}"
              exit 1
            fi
            name="${line%%:*}"
            if [[ ! "$name" =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::invalid group name: ${name}"
              exit 1
            fi
            names+=("$name")
            specs+=("${line#*:}")
          done <<< "$GROUP_SPEC"

          emit_all() {
            local json="" name
            for name in "${names[@]}"; do
              if [[ -n "$json" ]]; then
                json="${json},"
              fi
              json="${json}\"${name}\""
            done
            echo "groups=[${json}]" >> "$GITHUB_OUTPUT"
            echo "Changed groups: [${json}]"
          }

          # Every event other than a pull request (push to main, tag, manual
          # run) builds everything.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "Event '${EVENT_NAME}' is not pull_request; building every group."
            emit_all
            exit 0
          fi

          # A pull request checkout is a merge commit; its first parent is the
          # base branch. If the diff cannot be computed, build everything
          # (fail safe) instead of silently skipping jobs.
          if ! changed="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "::warning::cannot diff HEAD^1..HEAD; building every group"
            emit_all
            exit 0
          fi

          read -r -a always_patterns <<< "$ALWAYS"

          selected=()
          for idx in "${!names[@]}"; do
            selected[idx]=false
          done

          while IFS= read -r file; do
            if [[ -z "$file" ]]; then
              continue
            fi
            for pattern in "${always_patterns[@]}"; do
              # The pattern is a glob on purpose: the star also matches '/'.
              # shellcheck disable=SC2053
              if [[ "$file" == $pattern ]]; then
                echo "File '${file}' matches always pattern '${pattern}'; building every group."
                emit_all
                exit 0
              fi
            done
            for idx in "${!names[@]}"; do
              read -r -a group_patterns <<< "${specs[idx]}"
              for pattern in "${group_patterns[@]}"; do
                # shellcheck disable=SC2053
                if [[ "$file" == $pattern ]]; then
                  selected[idx]=true
                fi
              done
            done
          done <<< "$changed"

          result=()
          for idx in "${!names[@]}"; do
            if [[ "${selected[idx]}" == "true" ]]; then
              result+=("${names[idx]}")
            fi
          done

          json=""
          for name in "${result[@]}"; do
            if [[ -n "$json" ]]; then
              json="${json},"
            fi
            json="${json}\"${name}\""
          done
          echo "groups=[${json}]" >> "$GITHUB_OUTPUT"
          echo "Changed groups: [${json}]"
