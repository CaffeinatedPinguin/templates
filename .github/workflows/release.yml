name: release

# Reusable tag-release workflow. A caller runs it only for a version tag. The
# release notes are generated by one inline bash step so the behaviour lives in
# exactly one place (a reusable workflow cannot reference a sibling action at
# its own commit SHA).
on:
  workflow_call:
    inputs:
      title-prefix:
        description: Prefix prepended to the tag in the release title.
        required: false
        default: ""
        type: string
      image-name:
        description: GHCR image name for the notes section (empty = omit it).
        required: false
        default: ""
        type: string
      assets-artifact:
        description: Artifact holding release assets (empty = no assets).
        required: false
        default: ""
        type: string
      assets-glob:
        description: Files passed to gh release create as assets.
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download release assets
        if: inputs.assets-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.assets-artifact }}
          path: .

      # Self-contained on purpose: the gate extracts and runs this block in a
      # throwaway repository, so it must not contain ${{ }} expressions.
      - name: Build release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          IMAGE_NAME: ${{ inputs.image-name }}
          OWNER: ${{ github.repository_owner }}
          OUT: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          : "${TAG:?TAG is required}"
          : "${OUT:?OUT is required}"
          owner="${OWNER:-}"
          image_name="${IMAGE_NAME:-}"
          log_format="- \`%h\` %s"
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            if [[ -n "$previous" ]]; then
              range="${previous}..${TAG}"
              echo "Commits since \`${previous}\`:"
            else
              range="${TAG}"
              echo "Commits included in this release:"
            fi
            echo
            if git log --format="$log_format" "$range" | grep -q .; then
              git log --format="$log_format" "$range"
            else
              echo "- No commits recorded for this range."
            fi
            if [[ -n "$image_name" ]]; then
              image="ghcr.io/${owner,,}/${image_name}:${TAG}"
              echo
              echo "## Docker image"
              echo
              echo "- Pull: \`docker pull ${image}\`"
              echo "- Image: \`${image}\`"
            fi
          } > "$OUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE_PREFIX: ${{ inputs.title-prefix }}
          ASSETS_GLOB: ${{ inputs.assets-glob }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          assets=()
          if [[ -n "${ASSETS_GLOB// }" ]]; then
            # Intentional word splitting and globbing of the caller pattern.
            # shellcheck disable=SC2206
            assets=( $ASSETS_GLOB )
          fi
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "${TITLE_PREFIX}${TAG}" \
            --notes-file "$NOTES_FILE"
