name: docker

# Reusable Docker build workflow. The build+smoke job never publishes and only
# needs contents: read. Publishing to GHCR happens in a separate job so the
# registry write permission is scoped to the single job that pushes.
on:
  workflow_call:
    inputs:
      image-name:
        description: Lowercase image name (GHCR package name).
        required: true
        type: string
      ref:
        description: Git ref to check out (empty = the event ref); a PR head run never writes cache.
        required: false
        default: ""
        type: string
      context:
        description: Docker build context.
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root.
        required: false
        default: Dockerfile
        type: string
      target:
        description: Optional multi-stage build target.
        required: false
        default: ""
        type: string
      artifact-name:
        description: Artifact to download before building (empty = skip).
        required: false
        default: ""
        type: string
      artifact-path:
        description: Download destination for the artifact.
        required: false
        default: dist
        type: string
      smoke-paths:
        description: Space-separated HTTP paths probed after the image starts.
        required: false
        default: /
        type: string
      push:
        description: Push the image to GHCR with version and stable tags.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      CONTEXT: ${{ inputs.context }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      TARGET: ${{ inputs.target }}
      SMOKE_PATHS: ${{ inputs.smoke-paths }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "$CONTEXT" =~ ^(\.|[A-Za-z0-9_-][A-Za-z0-9._-]*)(/(\.|[A-Za-z0-9_-][A-Za-z0-9._-]*))*$ ]]
          [[ "$DOCKERFILE" =~ ^(\.|[A-Za-z0-9_-][A-Za-z0-9._-]*)(/(\.|[A-Za-z0-9_-][A-Za-z0-9._-]*))*$ ]]
          [[ -z "$TARGET" || "$TARGET" =~ ^[A-Za-z0-9._-]+$ ]]
          # Space-separated path list: spaces separate entries; shell
          # metacharacters (; $ ( ) backtick | & < > quotes newlines) stay
          # rejected. Kept in a variable so shellcheck parses the regex as one
          # word instead of splitting it at the literal space.
          paths_re='^[A-Za-z0-9._~/%?=+,:@ -]*$'
          [[ "$SMOKE_PATHS" =~ $paths_re ]]

      - name: Download build artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          pull: true
          load: true
          tags: local/${{ inputs.image-name }}:ci
          cache-from: type=gha,scope=${{ github.repository }}-${{ inputs.image-name }}
          # A PR-head run may read the cache but must never write an entry that
          # trusted main/tag builds would restore (cache poisoning).
          cache-to: ${{ inputs.ref == '' && format('type=gha,scope={0}-{1},mode=max', github.repository, inputs.image-name) || '' }}
          provenance: false
          sbom: false

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          container="docker-smoke-${IMAGE_NAME}"
          image="local/${IMAGE_NAME}:ci"
          docker run --rm -d -p 18080:8080 --name "$container" "$image" >/dev/null
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          healthy=false
          for _ in $(seq 1 30); do
            if docker exec "$container" wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::image did not become healthy within 30s"
            docker logs "$container" || true
            exit 1
          fi

          read -r -a paths <<< "$SMOKE_PATHS" || true
          for path in "${paths[@]}"; do
            docker exec "$container" wget -qO- "http://127.0.0.1:8080${path}" >/dev/null
          done

  push:
    name: publish image
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      CONTEXT: ${{ inputs.context }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download build artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: Compute image reference
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Publishing is authoritative only for an immutable version tag; a
          # branch push would otherwise move :stable to an untagged commit.
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::refusing to publish for ref type '${REF_TYPE}'; only version tags may be released"
            exit 1
          fi
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to publish '${REF_NAME}'; expected a vX.Y.Z release tag"
            exit 1
          fi
          echo "registry=ghcr.io/${OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          pull: true
          push: true
          tags: |
            ${{ steps.image.outputs.registry }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.registry }}:stable
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=${{ github.repository }}-${{ inputs.image-name }}
          cache-to: type=gha,scope=${{ github.repository }}-${{ inputs.image-name }},mode=max
          provenance: false
          sbom: false
