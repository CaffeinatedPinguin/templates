name: conventions

# Reusable pull request conventions check. A caller runs it on pull_request and
# grants no permissions; the job only reads the PR title and author from the
# event through environment variables, so no untrusted value is interpolated
# into the shell source. An empty title means a non-pull_request caller and
# skips validation.
on:
  workflow_call:

permissions: {}

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Validate conventions
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|refactor|perf|test|build|ci|chore|revert'
          # A tag or manual run has no pull request context.
          if [[ -z "$TITLE" ]]; then
            echo "No pull request context; skipping convention checks."
            exit 0
          fi
          # Dependabot sets its own titles, so its pull requests are exempt.
          if [[ "$AUTHOR" == 'dependabot[bot]' ]]; then
            echo "PR author $AUTHOR is exempt; skipping convention checks."
            exit 0
          fi
          if [[ ! "$TITLE" =~ ^($types)(\([a-z0-9._/-]+\))?!?:\ [^[:space:]].*[^.[:space:]]$ ]]; then
            case "$TITLE" in
              'Revert "'*) ;;
              *)
                echo "::error::PR title must follow Conventional Commits without a trailing dot, e.g. 'feat(api): add csv export', or start with 'Revert \"'."
                exit 1
                ;;
            esac
          fi
