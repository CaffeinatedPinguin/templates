name: conventions

# Reusable pull request conventions check. A caller runs it on pull_request and
# grants no permissions; the job only reads PR metadata from the event through
# environment variables, so no untrusted value is interpolated into the shell
# source. An empty title means a non-pull_request caller and skips validation.
on:
  workflow_call:

permissions: {}

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Validate conventions
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|refactor|perf|test|build|ci|chore|revert'
          # A tag or manual run has no pull request context.
          if [[ -z "$TITLE" ]]; then
            echo "No pull request context; skipping convention checks."
            exit 0
          fi
          if [[ ! "$TITLE" =~ ^($types)(\([a-z0-9._/-]+\))?!?:\ [^[:space:]].*[^.[:space:]]$ && ! "$TITLE" =~ ^Revert\ ".+"$ ]]; then
            echo "::error::PR title must look like 'type(scope): imperative description' without a trailing dot. Types: ${types//|/, }"
            exit 1
          fi
          if (( ${#TITLE} > 100 )); then
            echo "::error::PR title exceeds 100 characters"
            exit 1
          fi
          if [[ ! "$BRANCH" =~ ^($types)/[a-z0-9][a-z0-9._-]{1,48}$ && ! "$BRANCH" =~ ^dependabot/ && ! "$BRANCH" =~ ^renovate/ ]]; then
            echo "::error::Branch must look like type/kebab-slug or type/<issue>-slug, e.g. feat/42-csv-export"
            exit 1
          fi
          # feat/fix without a linked issue is a warning, not a blocker.
          if [[ "$TITLE" =~ ^(feat|fix) ]] && ! grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) #[0-9]+' <<<"$BODY"; then
            echo "::warning::feat/fix without 'Closes #N' or 'Refs #N' in the PR body"
          fi
