name: dependency-review

# Reusable dependency review workflow. A caller runs it on pull_request; the
# job needs contents: read to inspect the diff and never gets write
# permissions.
on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Minimum vulnerability severity that fails the review.
        required: false
        default: high
        type: string

permissions: {}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          comment-summary-in-pr: never
