# Keep dependency noise low: one grouped pull request per month for minor and
# patch updates, while each major update arrives separately. Security updates
# still come immediately, regardless of this schedule.
version: 2
# Security updates are grouped into one pull request per ecosystem; each major
# version update stays separate.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 3
